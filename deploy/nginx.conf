limit_req_zone $binary_remote_addr zone=unwatermark_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=unwatermark_connections:1m;
server {
    listen 80;
    server_name unwatermark.pure-diet.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/unwatermark-acme; }
    location / { return 301 https://unwatermark.pure-diet.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name unwatermark.pure-diet.com;
    ssl_certificate /etc/letsencrypt/live/unwatermark.pure-diet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unwatermark.pure-diet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Browser identity and export password checks are enforced by the application.
    client_max_body_size 27m;
    client_body_timeout 30s;
    limit_req zone=unwatermark_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn unwatermark_connections 8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /var/log/nginx/unwatermark-access.log;
    error_log /var/log/nginx/unwatermark-error.log;
    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Host unwatermark.pure-diet.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}
